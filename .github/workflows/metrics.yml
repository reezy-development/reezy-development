name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Metrics - Base
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          config_timezone: Europe/Berlin
          base: header
          filename: metrics-base.svg
          repositories_skipped: reezy-development, reezy-development/reezy-development
          committer_message: "❤️ update metrics"
