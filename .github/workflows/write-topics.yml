name: Add topic word cloud

on:
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate word cloud
        uses: stefani-gifta/wordcloud-repo-topics@main
        with:
          token: ${{ secrets.GH_TOKEN }}
          color: ef4444
          commit_msg: "❤️ update topic cloud"
